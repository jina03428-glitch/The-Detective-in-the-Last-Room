<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11100f" />
    <title>The Detective in the Last Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=ui-editor-final-sync-1" />
  </head>
  <body>
    <main class="title-screen" aria-label="게임 시작 화면">
      <div class="film-grain" aria-hidden="true"></div>
      <div class="scene-vignette" aria-hidden="true"></div>
      <div class="black-screen" aria-hidden="true">
        <span class="intro-time">21:18</span>
        <img class="intro-scene" src="./public/assets/train-compartment.png" alt="열차 객실" />
        <div class="dialogue-ui" aria-hidden="true">
          <button class="dialogue-menu-button" type="button" aria-label="메뉴 열기" aria-expanded="false" onclick="const ui=this.closest('.dialogue-ui'); const options=ui.querySelector('.dialogue-menu-options'); const open=ui.classList.toggle('menu-open'); options.classList.toggle('is-open', open); options.setAttribute('aria-hidden', String(!open)); this.setAttribute('aria-expanded', String(open));">
            <img src="./public/assets/dialogue-menu.png" alt="메뉴" />
          </button>
          <div class="dialogue-menu-options" aria-hidden="true">
            <button type="button" data-menu-action="notebook" aria-label="수첩"><img src="./public/assets/menu-notebook.png" alt="수첩" /></button>
            <button type="button" data-menu-action="move" aria-label="이동"><img src="./public/assets/menu-move.png" alt="이동" /></button>
            <button type="button" data-menu-action="hint" aria-label="힌트"><img src="./public/assets/menu-hint.png" alt="힌트" /></button>
            <button type="button" data-menu-action="settings" aria-label="설정"><img src="./public/assets/menu-settings.png" alt="설정" /></button>
          </div>
          <img class="dialogue-panel" src="./public/assets/dialogue-panel.png" alt="대화창" />
          <img class="dialogue-nameplate" src="./public/assets/dialogue-box.png" alt="이름표" />
          <img class="dialogue-arrow" src="./public/assets/dialogue-arrow.png" alt="다음 대화" />
          <button class="dialogue-next" type="button" aria-label="다음 대사"></button>
          <p class="dialogue-text" aria-live="polite"></p>
          <button class="dialogue-bottom-button dialogue-auto" type="button" aria-label="자동 진행">
            <img src="./public/assets/dialogue-auto.png" alt="자동" />
          </button>
          <button class="dialogue-bottom-button dialogue-fast" type="button" aria-label="빠르게 감기">
            <img src="./public/assets/fast-forward.png" alt="빠르게 감기" />
          </button>
          <button class="dialogue-bottom-button dialogue-record" type="button" aria-label="기록">
            <img src="./public/assets/dialogue-record.png" alt="기록" />
          </button>
        </div>
      <section class="dialogue-record-overlay" aria-hidden="true" aria-label="지난 대화">
          <img class="dialogue-record-frame" src="./public/assets/dialogue-record-panel.png" alt="지난 대화" />
          <div class="dialogue-record-list" aria-live="polite"></div>
          <button class="dialogue-record-close" type="button" aria-label="기록창 닫기">×</button>
        </section>
        <aside class="ui-editor" aria-hidden="true" aria-label="개발용 UI 편집기">
          <div class="ui-editor-title">UI 편집기 <small>F2</small></div>
          <label>대상
            <select id="ui-editor-target">
              <option value=".dialogue-panel">대화창</option>
              <option value=".dialogue-nameplate">이름표</option>
              <option value=".dialogue-text">대사</option>
              <option value=".dialogue-arrow">화살표</option>
              <option value=".dialogue-auto">자동 버튼</option>
              <option value=".dialogue-fast">빨리감기 버튼</option>
              <option value=".dialogue-record">기록 버튼</option>
            </select>
          </label>
          <div class="ui-editor-coordinates">
            <label>X <input id="ui-editor-x" type="number" step="1" /></label>
            <label>Y <input id="ui-editor-y" type="number" step="1" /></label>
          </div>
          <div class="ui-editor-actions">
            <button type="button" id="ui-editor-save">저장</button>
            <button type="button" id="ui-editor-reset">초기화</button>
            <button type="button" id="ui-editor-close">닫기</button>
          </div>
          <p>대상을 선택한 뒤 화면에서 직접 드래그하세요.</p>
        </aside>
      </div>

      <section class="hero-copy">
        <img class="game-logo" src="./public/assets/game-logo.png" alt="마지막 방의 탐정" />
      </section>

      <section class="menu-card" aria-label="메인 메뉴">
        <div class="menu-actions">
          <button class="image-button" data-action="start" aria-label="새로하기"><img src="./public/assets/button-new.png" alt="새로하기" /></button>
          <button class="image-button" data-action="continue" aria-label="이어하기"><img src="./public/assets/button-continue.png" alt="이어하기" /></button>
          <button class="image-button" data-action="settings" aria-label="설정"><img src="./public/assets/button-settings.png" alt="설정" /></button>
          <button class="image-button" data-action="exit" aria-label="게임 종료"><img src="./public/assets/button-exit.png" alt="게임 종료" /></button>
        </div>
      </section>

      <div class="toast" role="status" aria-live="polite"></div>
      <dialog class="settings-dialog">
        <div class="settings-panel">
          <button class="close-dialog" aria-label="설정 닫기"><img src="./public/assets/settings-close.png" alt="닫기" /></button>
          <div class="settings-controls">
            <label class="range-control bgm-control" aria-label="배경음악 볼륨">
              <span class="slider-shell" style="--value: 80%"><input id="bgm-volume" type="range" min="0" max="100" value="80" /></span>
              <output for="bgm-volume">80%</output>
            </label>
            <label class="range-control se-control" aria-label="효과음 볼륨">
              <span class="slider-shell" style="--value: 80%"><input id="se-volume" type="range" min="0" max="100" value="80" /></span>
              <output for="se-volume">80%</output>
            </label>
            <div class="choice-control speed-control" aria-label="텍스트 속도">
              <button class="choice-button image-choice-button" data-setting="speed" data-value="slow" aria-label="느림">
                <img src="./public/assets/text-speed-slow-light.png" data-light="./public/assets/text-speed-slow-light.png" data-dark="./public/assets/text-speed-slow-dark.png" alt="느림">
              </button>
              <button class="choice-button image-choice-button active" data-setting="speed" data-value="normal" aria-label="보통">
                <img src="./public/assets/text-speed-normal-dark.png" data-light="./public/assets/text-speed-normal-light.png" data-dark="./public/assets/text-speed-normal-dark.png" alt="보통">
              </button>
              <button class="choice-button image-choice-button" data-setting="speed" data-value="fast" aria-label="빠름">
                <img src="./public/assets/text-speed-fast-light.png" data-light="./public/assets/text-speed-fast-light.png" data-dark="./public/assets/text-speed-fast-dark.png" alt="빠름">
              </button>
            </div>
            <div class="choice-control display-control" aria-label="화면 모드">
              <button class="choice-button image-choice-button active" data-setting="display" data-value="windowed" aria-label="창 모드">
                <img src="./public/assets/display-windowed-dark.png" data-light="./public/assets/display-windowed-light.png" data-dark="./public/assets/display-windowed-dark.png" alt="창 모드">
              </button>
              <button class="choice-button image-choice-button" data-setting="display" data-value="fullscreen" aria-label="전체 화면">
                <img src="./public/assets/display-fullscreen-light.png" data-light="./public/assets/display-fullscreen-light.png" data-dark="./public/assets/display-fullscreen-dark.png" alt="전체 화면">
              </button>
            </div>
            <div class="settings-actions" aria-label="설정창 하단 메뉴">
              <button class="settings-action-button" data-action="settings-quit" aria-label="게임 종료">
                <img src="./public/assets/action-exit.png" alt="게임 종료">
              </button>
              <button class="settings-action-button" data-action="settings-home" aria-label="메인화면">
                <img src="./public/assets/action-home.png" alt="메인화면">
              </button>
              <button class="settings-action-button" data-action="settings-reset" aria-label="기본값 복원">
                <img src="./public/assets/action-reset.png" alt="기본값 복원">
              </button>
            </div>
          </div>
        </div>
      </dialog>
    </main>
    <script src="./script.js?v=ui-editor-autosave-1"></script>
  </body>
</html>
